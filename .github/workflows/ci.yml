name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testy a build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testy
        run: dotnet test tests/Prepni.Core.Tests
      - name: Build aplikace
        run: dotnet build src/Prepni -c Release
