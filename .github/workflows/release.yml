name: Vydání

# Tag v* (třeba v0.1.0) postaví Prepni.exe (Native AOT, bez .NET runtime) a přiloží ho k vydání na GitHubu.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Prepni.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testy
        run: dotnet test tests/Prepni.Core.Tests
      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/Prepni -c Release -r win-x64 -p:Version=$version -o publish
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/Prepni.exe
          generate_release_notes: true
